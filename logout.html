<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialPay - Logging Out</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        socialGreen: '#00FF88',
                        socialDark: '#0B130E',
                        socialCard: '#12221A',
                        socialBorder: '#1F3827',
                        darkHover: '#182C20'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B130E;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0B130E; }
        ::-webkit-scrollbar-thumb { background: #1F3827; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-socialGreen selection:text-black">

    <!-- LOGOUT CARD CONTAINER -->
    <div class="max-w-md w-full bg-[#12221A] border border-[#1F3827] rounded-3xl p-8 text-center shadow-2xl space-y-6">
        <div class="w-16 h-16 rounded-2xl bg-socialGreen/20 text-socialGreen flex items-center justify-center text-2xl mx-auto shadow-lg shadow-socialGreen/10 animate-pulse">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </div>

        <div>
            <h1 class="text-2xl font-extrabold text-white mb-2">Logging Out...</h1>
            <p class="text-xs text-zinc-400">Terminating your secure session and clearing local cache.</p>
        </div>

        <div class="flex items-center justify-center py-4">
            <div class="w-8 h-8 border-4 border-[#1F3827] border-t-socialGreen rounded-full animate-spin"></div>
        </div>

        <div class="pt-2">
            <a href="login.html" class="w-full bg-socialGreen text-black font-bold py-3.5 rounded-xl hover:bg-emerald-400 transition-all shadow-lg shadow-socialGreen/15 text-xs uppercase tracking-wider block text-center">
                Click here if not redirected
            </a>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="absolute bottom-6 text-center text-xs text-zinc-500">
        &copy; 2026 SocialPay SS. All rights reserved.
    </footer>

    <!-- LOGOUT SCRIPT -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Clear user session data from localStorage
            localStorage.removeItem("socialPayUser");
            localStorage.removeItem("socialPayAdminLoggedIn");

            // Redirect to login page after a brief delay
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1500);
        });
    </script>
</body>
</html>
